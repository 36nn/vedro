# Конфигурация Alembic. Реальный URL базы подставляется из backend/.env
# в файле alembic/env.py (строка sqlalchemy.url ниже — заглушка).

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S